# Deploy games — builds each web game listed in web-games.json from its source
# repo (private repos OK) with scripts/build-web-game.mjs, then publishes this
# repo plus those builds to GitHub Pages. Nothing is committed back.
#
# Setup (once per game): add a repo secret named by that game's "tokenSecret"
# in web-games.json (e.g. LEX_DEMO_SRC_TOKEN) — a fine-grained personal access
# token with read-only "Contents" access to that game's source repo — and map
# it into the build step's env below.

name: Deploy games

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'   # daily, 09:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  repository_dispatch:     # lets a source repo trigger a rebuild on push
    types: [web-game-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build each web game
        env:
          LEX_DEMO_SRC_TOKEN: ${{ secrets.LEX_DEMO_SRC_TOKEN }}
        run: |
          set -euo pipefail
          jq -c '.[]' web-games.json | while read -r game; do
            slug=$(jq -r .slug <<<"$game")
            repo=$(jq -r .repo <<<"$game")
            ref=$(jq -r '.ref // "main"' <<<"$game")
            secret=$(jq -r .tokenSecret <<<"$game")
            TOKEN="${!secret:-}"
            if [ -z "$TOKEN" ]; then echo "::error::secret $secret is not set (needed for $slug)"; exit 1; fi
            echo "::add-mask::$TOKEN"
            echo "::group::$slug ← $repo@$ref"
            git clone --depth 1 --branch "$ref" "https://x-access-token:${TOKEN}@github.com/${repo}.git" "$RUNNER_TEMP/src-$slug"
            node scripts/build-web-game.mjs "$slug" "$RUNNER_TEMP/src-$slug"
            echo "::endgroup::"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
