<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games · BeetleBox Studios</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/beetlebox-studios/branding-assets/main/logo/beetle_square.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --hue: 140;
      --primary:    oklch(0.75 0.18 var(--hue));
      --page-bg:    oklch(0.14 0.012 var(--hue));
      --card-bg:    oklch(0.20 0.014 var(--hue));
      --float-bg:   oklch(0.17 0.013 var(--hue));
      --text:       oklch(0.92 0.005 var(--hue));
      --text-dim:   oklch(0.62 0.01  var(--hue));
      --text-muted: oklch(0.42 0.008 var(--hue));
      --border:     color-mix(in oklch, white 7%, transparent);
      --border-strong: color-mix(in oklch, white 14%, transparent);
      --radius:     12px;
      --radius-lg:  16px;
      --shadow:     0 2px 12px rgba(0,0,0,0.5);
      --shadow-lg:  0 8px 32px rgba(0,0,0,0.7);
      --ease:       cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --navbar-h:   4.5rem;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--page-bg);
      color: var(--text);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    #navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0.75rem 1.5rem;
    }
    .navbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      height: var(--navbar-h);
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--float-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 0 1.25rem;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
    }
    .navbar-logo {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius);
      transition: color 0.15s var(--ease), background 0.15s var(--ease);
    }
    .navbar-logo:hover { color: var(--primary); background: color-mix(in oklch, var(--primary) 10%, transparent); }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: calc(var(--navbar-h) + 2.5rem + 0.75rem) 1.5rem 4rem;
    }
    .page-title {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), transform 0.15s var(--ease);
      cursor: pointer;
    }
    .game-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }
    .game-card__thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      background: oklch(0.18 0.02 var(--hue));
    }
    .game-card__body {
      padding: 1rem 1.25rem 1.25rem;
    }
    .game-card__meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 0.3rem;
      opacity: 0.85;
    }
    .game-card__title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.4rem;
    }
    .game-card__desc {
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--text-dim);
    }
    .game-card__play {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1rem;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--primary);
      padding: 0.4rem 0.875rem;
      border-radius: 999px;
      background: color-mix(in oklch, var(--primary) 12%, transparent);
      border: 1px solid color-mix(in oklch, var(--primary) 25%, transparent);
      transition: background 0.15s var(--ease);
    }
    .game-card__play:hover { background: color-mix(in oklch, var(--primary) 20%, transparent); }
  </style>
</head>
<body>

<header id="navbar">
  <div class="navbar-inner">
    <a href="https://beetlebox-studios.github.io" class="navbar-logo">BeetleBox</a>
  </div>
</header>

<main>
  <h1 class="page-title">Games</h1>
  <div class="games-grid">

    <a class="game-card" href="bubblefish/">
      <img class="game-card__thumb" src="https://raw.githubusercontent.com/beetlebox-studios/branding-assets/main/project_thumbnails/bubblefish_thumbnail.png" alt="Bubblefish" />
      <div class="game-card__body">
        <p class="game-card__meta">Unity 2D · Retro · 2026</p>
        <p class="game-card__title">Bubblefish</p>
        <p class="game-card__desc">Puru Puru is a pufferfish who wants his tank all to himself.</p>
        <span class="game-card__play"><i class="fa-solid fa-play"></i> Play</span>
      </div>
    </a>

    <a class="game-card" href="masknum-opus/">
      <img class="game-card__thumb" src="https://raw.githubusercontent.com/beetlebox-studios/branding-assets/main/project_thumbnails/masknum_thumbnail.png" alt="Masknum Opus" />
      <div class="game-card__body">
        <p class="game-card__meta">Unity 2D · Story · 2026</p>
        <p class="game-card__title">Masknum Opus</p>
        <p class="game-card__desc">Infiltrate a bizarre, masked cult.</p>
        <span class="game-card__play"><i class="fa-solid fa-play"></i> Play</span>
      </div>
    </a>

    <a class="game-card" href="molith/">
      <img class="game-card__thumb" src="https://raw.githubusercontent.com/beetlebox-studios/branding-assets/main/project_thumbnails/molith_thumbnail.png" alt="Molith" />
      <div class="game-card__body">
        <p class="game-card__meta">Unity 3D · Exploration · 2025</p>
        <p class="game-card__title">Molith</p>
        <p class="game-card__desc">Explore a mysterious field.</p>
        <span class="game-card__play"><i class="fa-solid fa-play"></i> Play</span>
      </div>
    </a>

  </div>
</main>

</body>
</html>
